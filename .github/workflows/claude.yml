name: Claude
on:
  issue_comment: { types: [created] }
  issues: { types: [opened] }
  pull_request_review_comment: { types: [created] }

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
      BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
      BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
      BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: AL-Compiler installieren
        run: |
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --prerelease
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/al" version
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
